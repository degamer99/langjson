<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9fafb" />
    <meta name="description" content="A privacy-friendly interlinear reader for language learners. Upload a JSON text with sentence, translation, and word-by-word glosses, and read it with customizable themes and layout — entirely in your browser." />
    <meta property="og:title" content="Interlinear Language Reader" />
    <meta property="og:description" content="Read interlinear texts with word-by-word glosses, customizable themes, and RTL support — all client-side." />
    <meta property="og:type" content="website" />
    <title>Interlinear Language Reader</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA iOS Support -->
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
</head>
  <body class="bg-gray-50 text-slate-900 transition-colors duration-300 dark:bg-slate-900 dark:text-slate-100">
    <div id="root"></div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('PWA ServiceWorker registered: ', registration.scope);
            })
            .catch((error) => {
              console.log('PWA ServiceWorker registration failed: ', error);
            });
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
